[workspace]
resolver = "2"
members = ["crates/quay-core", "crates/quay-cli", "crates/quay"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/evgeniiPerov/quay"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.10"
assert_cmd = "2.0"
assert_fs = "1.1"
predicates = "3.1"
wiremock = "0.6"
tokio = { version = "1", features = ["rt"] }
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tui-textarea = "0.7"
nucleo-matcher = "0.3"
ratatui-form = "=0.1.1"

# The profile that 'dist' will build with.
# Dist config lives at <repo-root>/dist-workspace.toml because the cargo
# workspace is nested under apps/cli/.
[profile.dist]
inherits = "release"
lto = "thin"
