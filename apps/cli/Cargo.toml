[workspace]
resolver = "2"
members = ["crates/quay-core", "crates/quay-cli", "crates/quay", "crates/quay-mcp"]

[workspace.package]
version = "0.15.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/evgeniiPerov/quay"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3.27"
assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std"] }
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
anyhow = "1"
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dialoguer = "0.12"
similar = "3"
insta = "1"
dirs = "6.0"

# The profile that 'dist' will build with.
# Dist config lives at <repo-root>/dist-workspace.toml because the cargo
# workspace is nested under apps/cli/.
[profile.dist]
inherits = "release"
lto = "thin"
