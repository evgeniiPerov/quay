name: docs
on:
  push:
    branches: [main]
    paths: [docs/book/**, .github/workflows/docs.yml]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mdBook
        run: cargo install mdbook --version 0.4.43 --locked
      # Pinned to the 0.4 series: mdbook-mermaid 0.17.0 was rewritten for mdbook
      # 0.5 (it dropped the mdbook dependency entirely) and fails against the
      # 0.4.43 pinned above with "Unable to parse the input". Bump both together.
      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --version 0.16.2 --locked
      - name: Generate mermaid assets
        working-directory: docs/book
        run: mdbook-mermaid install .
      - name: Build
        working-directory: docs/book
        run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
