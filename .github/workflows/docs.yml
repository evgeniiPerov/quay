name: docs
on:
  push:
    branches: [main]
    paths: [docs/book/**, .github/workflows/docs.yml]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mdBook
        run: cargo install mdbook --version 0.4.43 --locked
      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --locked
      - name: Generate mermaid assets
        working-directory: docs/book
        run: mdbook-mermaid install .
      - name: Build
        working-directory: docs/book
        run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
