name: skill-security

# Static security scan of the vendored skills in .agents/skills/.
# Skills are Markdown that agents execute with implicit trust — this is the
# gate that a prompt-injection / exfiltration payload has to get past.
#
# Static only (--no-llm): no skill content leaves the runner.

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-security.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
  schedule:
    # Weekly — patterns and OSV data move even when our skills don't.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      # Pinned: SkillSpector cuts no releases and lands ~100 commits/month.
      # Bump deliberately, not implicitly.
      - name: Install SkillSpector
        run: uv tool install 'skillspector @ git+https://github.com/NVIDIA/skillspector.git@a54947c307fe19a24a43db55f6148e181a987a67'

      # One scan per skill dir: `--recursive` writes concatenated text rather
      # than merged SARIF. Exit 1 means risk > 50 — collect and fail at the end
      # so every skill still gets scanned and reported.
      #
      # SkillSpector emits uris relative to the scanned dir ("SKILL.md"), so
      # each file is rewritten to repo-root-relative or code scanning annotates
      # the wrong path.
      #
      # Accepted findings live in .skillspector-baseline.yaml — fingerprinted by
      # content, so an edit to a suppressed file surfaces again.
      # Exit 1 means "over the risk threshold" and is report-only. Anything else
      # means the scan did not happen — bad flags after a pin bump, a malformed
      # baseline, an OOM — and must stay blocking: an unscanned skill is not a
      # safe skill, and a green check would claim otherwise.
      - name: Scan skills
        id: scan
        run: |
          mkdir -p sarif
          shopt -s nullglob
          dirs=(.agents/skills/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::no skills found under .agents/skills/ — nothing was scanned"
            exit 1
          fi
          over=""
          broke=""
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            out="sarif/${name}.sarif"
            rc=0
            skillspector scan "$dir" --no-llm --format sarif --output "$out" \
              --baseline .skillspector-baseline.yaml || rc=$?
            case "$rc" in
              0) ;;
              1) over="${over} ${name}" ;;
              *) echo "::error::skillspector could not scan ${name} (exit ${rc})"
                 broke="${broke} ${name}"
                 continue ;;
            esac
            [ -f "$out" ] || { echo "::error::no SARIF produced for ${name}"; broke="${broke} ${name}"; continue; }
            jq --arg p "${dir}" \
              '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= $p + .' \
              "$out" > "${out}.tmp" && mv "${out}.tmp" "$out"
          done
          if [ -n "$over" ]; then
            echo "over_threshold=${over}" >> "$GITHUB_OUTPUT"
            echo "::warning::skills over risk threshold:${over}"
            {
              echo "### Skills over risk threshold"
              echo
              for s in $over; do echo "- \`$s\`"; done
              echo
              echo "Reported only — this does not block the pipeline."
              echo "Findings are in the Security tab under \`skill-security\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$broke" ]; then
            {
              echo "### Skills that could not be scanned"
              echo
              for s in $broke; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Code scanning rejects multiple runs sharing a category, so the per-skill
      # files are folded into a single run (rules deduped by id) rather than
      # uploaded as a directory.
      - name: Merge SARIF
        if: always()
        run: |
          jq -s '. as $all | {
            version: "2.1.0",
            "$schema": $all[0]["$schema"],
            runs: [{
              tool: { driver: ($all[0].runs[0].tool.driver
                       | .rules = ([$all[].runs[0].tool.driver.rules[]?] | unique_by(.id))) },
              results: [$all[].runs[0].results[]?]
            }]
          }' sarif/*.sarif > skills.sarif
          echo "merged $(jq '.runs[0].results | length' skills.sarif) findings"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skills.sarif
          category: skill-security

      # Report-only for now. `continue-on-error` means this step goes red while
      # the job still passes — a green tick next to a step named "over threshold"
      # would read as the opposite of what happened. Drop the continue-on-error
      # line to make the gate blocking once the findings are being acted on.
      #
      # Never interpolate ${{ }} into run: — skill dir names come from the PR
      # tree, so they reach the shell as data, not as script.
      - name: Skills over risk threshold (report-only)
        if: steps.scan.outputs.over_threshold != ''
        continue-on-error: true
        env:
          OVER: ${{ steps.scan.outputs.over_threshold }}
        run: |
          echo "over threshold:${OVER}"
          exit 1
