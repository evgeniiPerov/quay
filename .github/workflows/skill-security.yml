name: skill-security

# Static security scan of the vendored skills in .agents/skills/.
# Skills are Markdown that agents execute with implicit trust — this is the
# gate that a prompt-injection / exfiltration payload has to get past.
#
# Static only (--no-llm): no skill content leaves the runner.

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-security.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
  schedule:
    # Weekly — patterns and OSV data move even when our skills don't.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      # Pinned: SkillSpector cuts no releases and lands ~100 commits/month.
      # Bump deliberately, not implicitly.
      - name: Install SkillSpector
        run: uv tool install 'skillspector @ git+https://github.com/NVIDIA/skillspector.git@a54947c307fe19a24a43db55f6148e181a987a67'

      # One scan per skill dir: `--recursive` writes concatenated text rather
      # than merged SARIF. Exit 1 means risk > 50 — collect and fail at the end
      # so every skill still gets scanned and reported.
      #
      # SkillSpector emits uris relative to the scanned dir ("SKILL.md"), so
      # each file is rewritten to repo-root-relative or code scanning annotates
      # the wrong path.
      #
      # Accepted findings live in .skillspector-baseline.yaml — fingerprinted by
      # content, so an edit to a suppressed file surfaces again.
      - name: Scan skills
        id: scan
        run: |
          mkdir -p sarif
          failed=""
          for dir in .agents/skills/*/; do
            name=$(basename "$dir")
            out="sarif/${name}.sarif"
            skillspector scan "$dir" --no-llm --format sarif --output "$out" \
              --baseline .skillspector-baseline.yaml \
              || failed="${failed} ${name}"
            jq --arg p "${dir}" \
              '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= $p + .' \
              "$out" > "${out}.tmp" && mv "${out}.tmp" "$out"
          done
          if [ -n "$failed" ]; then
            echo "over_threshold=${failed}" >> "$GITHUB_OUTPUT"
            echo "::warning::skills over risk threshold:${failed}"
            {
              echo "### Skills over risk threshold"
              echo
              for s in $failed; do echo "- \`$s\`"; done
              echo
              echo "Reported only — this check does not block the pipeline."
              echo "Findings are in the Security tab under \`skill-security\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Code scanning rejects multiple runs sharing a category, so the per-skill
      # files are folded into a single run (rules deduped by id) rather than
      # uploaded as a directory.
      - name: Merge SARIF
        if: always()
        run: |
          jq -s '. as $all | {
            version: "2.1.0",
            "$schema": $all[0]["$schema"],
            runs: [{
              tool: { driver: ($all[0].runs[0].tool.driver
                       | .rules = ([$all[].runs[0].tool.driver.rules[]?] | unique_by(.id))) },
              results: [$all[].runs[0].results[]?]
            }]
          }' sarif/*.sarif > skills.sarif
          echo "merged $(jq '.runs[0].results | length' skills.sarif) findings"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skills.sarif
          category: skill-security

      # Report-only for now: an over-threshold skill warns and lands in the
      # Security tab, but does not block. Flip this step back to `exit 1` to
      # make the gate blocking once the findings are being acted on.
      - name: Report over-threshold skills
        if: steps.scan.outputs.over_threshold != ''
        run: |
          echo "::notice::${{ steps.scan.outputs.over_threshold }} over threshold — reported, not blocking"
